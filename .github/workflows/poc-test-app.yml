name: POC test application

on:
  push:
    paths:
      - 'poc/LolrmmEsetTest/**'
      - 'poc/tests/Test-LolrmmEsetTest.ps1'
      - '.github/workflows/poc-test-app.yml'
  pull_request:
    paths:
      - 'poc/LolrmmEsetTest/**'
      - 'poc/tests/Test-LolrmmEsetTest.ps1'
      - '.github/workflows/poc-test-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained x64 executable
        run: >-
          dotnet publish poc/LolrmmEsetTest/LolrmmEsetTest.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output "${{ runner.temp }}\LolrmmEsetTest-win-x64"

      - name: Run smoke test
        shell: pwsh
        run: >-
          ./poc/tests/Test-LolrmmEsetTest.ps1
          -ExecutablePath "${{ runner.temp }}\LolrmmEsetTest-win-x64\LolrmmEsetTest.exe"

      - name: Package executable
        shell: pwsh
        run: >-
          Compress-Archive
          -Path "${{ runner.temp }}\LolrmmEsetTest-win-x64\*"
          -DestinationPath "${{ runner.temp }}\LolrmmEsetTest-win-x64.zip"
          -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LolrmmEsetTest-win-x64
          path: ${{ runner.temp }}\LolrmmEsetTest-win-x64.zip
          if-no-files-found: error
